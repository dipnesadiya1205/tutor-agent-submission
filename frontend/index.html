<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutor Bot</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong colours.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.dataset.theme = 'dark';
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="container">
      <div class="status-bar">
        <div class="brand">
          <h1>Natural Disasters</h1>
          <div class="status">Status: <strong id="connection-status">Disconnected</strong></div>
        </div>
        <div class="controls">
          <button id="connect-btn">Connect</button>
          <button id="pause-btn" disabled>Pause</button>
          <button id="disconnect-btn" disabled>Disconnect</button>
          <button id="theme-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
        </div>
      </div>

      <div class="layout">
      <aside class="deck" id="deck">
        <h3>Slides</h3>
        <ol class="deck-list" id="deck-list">
          <li class="deck-empty">Slides will show up once you connect.</li>
        </ol>
      </aside>

      <main class="stage">
      <section class="slide-panel" id="slide-panel">
        <div class="slide-meta">
          <span id="slide-counter">Not started</span>
          <span class="activity" id="activity" data-state="idle">
            <span class="activity-dot"></span>
            <span id="activity-label">Idle</span>
          </span>
          <span class="mode-badge" id="mode-badge">Presenting</span>
        </div>
        <h2 id="slide-title">Connect to begin the lesson</h2>
        <div class="slide-nav">
          <button id="prev-btn" disabled>&larr; Previous</button>
          <button id="next-btn" disabled>Next &rarr;</button>
        </div>
      </section>

      <audio id="bot-audio" autoplay></audio>

      <section class="transcript" id="transcript">
        <div class="transcript-empty">The conversation will appear here once the lesson starts.</div>
        <div class="transcript-list"></div>
      </section>

      <details class="debug-panel">
        <summary>Session log</summary>
        <div id="debug-log"></div>
      </details>
      </main>
      </div>
    </div>

    <script type="module" src="./app.ts"></script>
  </body>
</html>
